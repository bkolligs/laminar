[project]
name = "laminar"
version = "0.1.0"
description = "CLI for ingesting and querying feed items"
readme = "README.md"
authors = [
    { name = "Ben Kolligs", email = "benkolligs@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6,<7",
    "rich>=14.1,<15",
    "youtube-transcript-api>=1.2.4,<2",
]

[project.scripts]
laminar = "laminar:main"

[tool.uv]
package = true

[dependency-groups]
dev = [
    "pytest>=8.4.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["uv_build>=0.10.11,<0.11.0"]
build-backend = "uv_build"
